<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rincón — Vinícola</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <section class="hero">
      <div class="hero__bg-glow" aria-hidden="true"></div>

      <div class="hero__content">
        <p class="eyebrow">Vinícola Rincón · Colheita Autoral</p>
        <h1 class="headline">
          O silêncio<br />
          entre a <em>vinha</em><br />
          e a taça
        </h1>
        <p class="subcopy">
          Vinhos de terroir único, produzidos em pequenos lotes para
          preservar cada nuance da fruta.
        </p>
        <a href="#colecao" class="cta">Conhecer a coleção</a>
      </div>

      <div class="frame" id="frame">
        <div class="layer layer--back-bokeh" data-depth="0.35">
          <div class="layer__inner">
            <img src="assets/img/grapes.webp" alt="" />
          </div>
        </div>

        <div class="layer layer--glass" data-depth="0.6">
          <div class="layer__inner">
            <img src="assets/img/glass.webp" alt="Taça de vinho tinto" />
          </div>
        </div>

        <div class="layer layer--front-grapes" data-depth="0.9">
          <div class="layer__inner">
            <img src="assets/img/grapes.webp" alt="Cacho de uvas tintas" />
          </div>
        </div>
      </div>
    </section>

    <script src="assets/js/main.js"></script>
  </body>
</html>
